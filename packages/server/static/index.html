<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
  <div class="noise"></div>
  <div class="container">
    <header class="header">
      <div class="logo-mark">
        <span class="logo-icon">◈</span>
        <h1 class="logo">Code RAG</h1>
      </div>
      <p class="subtitle">hybrid retrieval for ReactJS documentation</p>
    </header>

    <main class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-inner">
          <h2 class="welcome-title">What are you looking for?</h2>
          <p class="welcome-desc">Search indexed ReactJS documentation with dense vectors + BM25 + reranking</p>
        </div>
        <div class="suggestions">
          <button class="chip" data-query="How do I use React hooks?">
            <span class="chip-icon">→</span>
            How do I use React hooks?
          </button>
          <button class="chip" data-query="What is useEffect cleanup?">
            <span class="chip-icon">→</span>
            What is useEffect cleanup?
          </button>
          <button class="chip" data-query="How to pass data between components?">
            <span class="chip-icon">→</span>
            How to pass data between components?
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>
    </main>

    <footer class="input-area">
      <form id="queryForm" class="input-form">
        <div class="input-glow"></div>
        <input
          type="text"
          id="queryInput"
          placeholder="Ask anything..."
          autocomplete="off"
          autofocus
        >
        <button type="submit" id="sendBtn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <!-- Document viewer overlay -->
  <div class="doc-overlay" id="docOverlay">
    <div class="doc-viewer">
      <div class="doc-viewer-header">
        <span class="doc-viewer-title" id="docTitle"></span>
        <button class="doc-viewer-close" id="docClose" aria-label="Close">&times;</button>
      </div>
      <div class="doc-viewer-content markdown-body" id="docContent"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="/static/app.js"></script>
</body>
</html>
